# Jalankan: docker compose up --build
# Butuh NVIDIA Container Toolkit. Di Windows pakai Docker Desktop + WSL2 (lihat docs/setup-local.md).
x-common: &common
  build: .
  env_file: .env
  volumes:
    - ./models:/srv/models
    - ./tmp:/srv/tmp
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  api:
    <<: *common
    ports: ["8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *common
    command: ["python", "-m", "app.worker"]
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
